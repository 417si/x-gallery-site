<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハッシュタグ画像ギャラリー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>ハッシュタグ画像ギャラリー</h1>
    <select id="hashtag-filter">
      <option value="">すべて</option>
    </select>
  </header>

  <main>
    <div id="gallery" class="gallery"></div>
    <button id="load-more">もっと見る</button>
    <p id="empty-message" class="hidden">画像がありません。</p>
  </main>

  <div id="lightbox" class="lightbox hidden">
    <button id="lightbox-close" class="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="">
    <a id="lightbox-link" href="#" target="_blank" rel="noopener noreferrer">元のポストを見る</a>
  </div>

  <script src="app.js"></script>
</body>
</html>
